project:
  type: default
  output-dir: _output

# Rendered output goes to paper/_output/, which .gitignore excludes; publish.sh copies
# the HTML and the PDF into docs/.

# The abstract lives here so that the course profile (_quarto-course.yml) can replace
# it. `quarto render alpha-decay.qmd --profile course` renders the paper without the
# machine-learning section.
abstract: |
  Several hundred cross-sectional return predictors have been published since the 1980s.
  We measure what happens to them after publication, using the 189 usable signals in the
  Chen and Zimmermann universe through December 2024. Mean monthly long-short returns
  fall 45 percent from the original sample window to the post-publication window, and
  the median signal loses 53 percent. The increment attributable to publication itself,
  over and above the decline that had already set in when the original sample ended, is
  not statistically significant, so the design does not separate arbitrage from
  selection in this universe. We rebuild two of the input series from security-level
  CRSP data to check the dataset. A real-time forecasting exercise over 1995 to 2024
  finds that next month's return on a published signal is weakly predictable, that no
  model beats another by a margin a test can distinguish, and that the predictive
  content sits in the signal's own return history: the publication clock adds nothing
  once that history is known.

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: Contents
    number-sections: true
    code-fold: true
    code-summary: "code"
    code-tools: true
    code-line-numbers: false
    fig-width: 7.5
    fig-height: 4.2
    fig-dpi: 160
    df-print: kable
    link-external-newwindow: true
    embed-resources: true
    # Quarto's automatic "Other Formats" box links to a PDF sitting next to the page.
    # The link is written whether or not that file was published, so it is off; the
    # opening callout links the PDF by hand and publish.sh guarantees it is there.
    format-links: false
  pdf:
    documentclass: article
    pdf-engine: xelatex        # the author's name needs a Unicode engine
    papersize: letter
    geometry:
      - margin=1in
    number-sections: true
    colorlinks: true
    fig-width: 6.5
    fig-height: 3.8
    code-line-numbers: false
    code-overflow: wrap        # a long source line must wrap, not run off the page
    callout-icon: false
    echo: false              # the PDF reads as a paper; the code is on the HTML page
    keep-tex: false

bibliography: references.bib
citeproc: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  cache: false

jupyter: python3
