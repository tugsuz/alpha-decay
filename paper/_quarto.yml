project:
  type: default
  output-dir: _output

# Rendered artefacts are regenerated from the .qmd; only the source is committed.
# `quarto render` writes into paper/_output/, which .gitignore excludes.

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: Contents
    number-sections: true
    code-fold: show
    code-summary: "code"
    code-tools: true
    code-line-numbers: false
    fig-width: 7.5
    fig-height: 4.2
    fig-dpi: 160
    df-print: kable
    link-external-newwindow: true
    embed-resources: true
    # Quarto's automatic "Other Formats" box links to a PDF sitting next to the page.
    # The link is written whether or not that file was published, so it is off; the
    # opening callout links the PDF by hand and publish.sh guarantees it is there.
    format-links: false
  pdf:
    documentclass: article
    pdf-engine: xelatex        # the author's name has a ğ in it
    papersize: letter
    geometry:
      - margin=1in
    number-sections: true
    colorlinks: true
    fig-width: 6.5
    fig-height: 3.8
    code-line-numbers: false
    code-overflow: wrap        # a long source line must wrap, not run off the page
    keep-tex: false

bibliography: references.bib
citeproc: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  cache: false

jupyter: python3
